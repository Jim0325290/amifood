<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <style>

        .menu-item { display: flex; justify-content: space-between; padding: 15px; background: white; border-bottom: 1px solid #eee; font-size: 1.1rem; }
        .price { color: #2d5a27; font-weight: bold; }

    <div class="container">
        <h2 style="text-align:center;">美味菜單</h2>

        <div class="menu-category">🍜 麵類系列</div>

        <div class="menu-item"><span>刀削麵</span><span class="price">$50</span></div>

        <div class="menu-item"><span>外帶素粽</span><span class="price">$50</span></div>

        <div class="menu-item"><span>豆腐/豆雞/豆皮/豆包/菜頭湯</span><span class="price">$35</span></div>

        <div class="menu-category">🥡 外帶大量訂購</div>
        <div class="menu-item"><span>豆包 (10入)</span><span class="price">$200</span></div>
