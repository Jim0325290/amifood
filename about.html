<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於阿美素食 - 品牌故事</title>
    <style>
        /* 基本樣式 */
        body { font-family: sans-serif; line-height: 1.6; background: #f9f9f9; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        .capy-img { width: 100%; max-width: 300px; display: block; margin: 20px auto; border-radius: 10px; }
        .btn-large { background: #eee; border: 1px solid #ccc; padding: 8px 15px; cursor: pointer; float: right; }
        
        /* 大字模式 */
        .large-font .about-content { font-size: 1.4rem; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-large" onclick="document.body.classList.toggle('large-font')">🔍 A+ 大字模式</button>
        
        <div class="about-content">
            <h2 style="color: #2d5a27;">關於我們</h2>
            
            <img src="copy_C6F1EC55-A830-4D2A-B354-3ED0D49B83CA.jpeg" alt="阿美素食水豚店長" class="capy-img">
            
            <p>在彰化陳稜路，阿美素食堅持手工製作，守護在地人的胃。從一顆香菇素圓開始，我們希望把這份溫暖傳遞給每一位來訪的客人。</p>
            
            <h3 style="color: #2d5a27;">店長的話</h3>
            <div style="border: 2px solid #2d5a27; padding: 15px; border-radius: 10px;">
                <p>「歡迎來到阿美素食！我們的豆包和素圓都是手工製作的，堅持新鮮與健康，水豚店長強力推薦，大家一定要來嚐嚐看喔！」</p>
            </div>
        </div>
    </div>
</body>
</html>
